# Configuración Bifrost (LM Studio backend)
# https://github.com/maximhq/bifrost

listen: "127.0.0.1:8000"  # Solo localhost
log_level: "info"

providers:
  - name: lmstudio
    type: openai
    base_url: "http://127.0.0.1:1234/v1"
    api_key: ""  # LM Studio no requiere API key

models:
  - provider: lmstudio
    model: "Qwen3-8B-Instruct-2507-GGUF"
    aliases: ["general", "qwen8b"]
  - provider: lmstudio
    model: "Qwen2.5-Coder-7B-Instruct-GGUF"
    aliases: ["coder", "codigo"]
  - provider: lmstudio
    model: "Qwen3-4B-Instruct-2507-GGUF"
    aliases: ["lite", "ligero", "portable"]

# Permite usar aliases desde Open WebUI (elegir general/coder/lite)
